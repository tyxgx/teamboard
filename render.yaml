# Render Blueprint: keeps the deploy settings in the repo instead of only in the dashboard.
# (Two past outages came from dashboard-only config: the service was pinned to a stale branch.)
services:
  - type: web
    name: teamboard-gees
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RTM_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
