name: Keep backend awake

on:
  schedule:
    # Every 10 minutes — Render's free tier sleeps after 15 min of inactivity
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sS --max-time 30 https://teamboard-gees.onrender.com || true
